name: CI — Admin Portal

# Same source tree as the customer portal (portal/), built into a separate image whose nginx serves admin.html at the
# root (portal/Dockerfile.admin). It has no tests of its own: ci-portal tests the same tree in a separate run, and
# this publish does not wait for it.
on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/ci-admin-portal.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published with this repository's token, the package is linked to this repository; the label records the source too.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: portal
          file: portal/Dockerfile.admin
          platforms: linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/openvicloud/frontend-admin-portal:${{ env.SHORT_SHA }}
