server {
    listen 80;
    root /usr/share/nginx/html;
    index admin.html;

    # Admin SPA fallback — unknown paths resolve to admin.html (react-router).
    location / {
        try_files $uri $uri/ /admin.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for the entry HTML and runtime config so new deploys are picked up immediately
    location = /admin.html {
        add_header Cache-Control "no-store";
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }
}
