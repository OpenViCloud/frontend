# Static site: real 404s, no single-page fallback (docs/features/public-site/design.md#site-deploy).
# X-Robots-Tag repeats in every location: a location with its own add_header drops the server-level ones.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
    }

    location /_astro/ {
        add_header X-Robots-Tag "noindex" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The install script downloads the CLI from its GitHub release (docs/features/cli/design.md#install-script); served
    # as text so `curl | sh` and a browser both get the script itself.
    location = /install.sh {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        types { }
        default_type text/plain;
    }

    location = /config.json {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;
    # `always`: without it nginx adds the header to 2xx/3xx responses only, and this page is served as a 404.
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
    }
}
